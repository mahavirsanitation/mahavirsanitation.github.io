:root{
  --bg:#F1F3F6;--surface:#FFFFFF;--raised:#FAFBFC;--sunken:#EDF0F4;--head:#F4F6F9;

  --accent:#DB5428;--on-accent:#FFFFFF;--accent-soft:#FCEAE3;

  --paper:#FFFFFF;--paper-ink:#111518;--paper-muted:#565C5F;--paper-line:#B9BEC0;--paper-soft:#EFF1F3;
  --f-ui:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:var(--f-ui);--f-display:var(--f-ui);
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px;--r-lg:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#E5EBF3;--ink-2:#C3CDDA;--muted:#93A1B5;--line:#253042;--line-strong:#36455C;

  --primary:#5B9BF5;--primary-hover:#7DB0F8;--on-primary:#0B1422;--primary-soft:#15263D;

html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;gap:12px;padding:14px 10px 10px}

.brand-mark{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:var(--paper)}
.brand-mark.has-icon,.brand-mark.has-icon img{background:none}
.brand-mark.sm{width:32px;height:32px;font-size:15px}
.brand-t{min-width:0}
.brand-name{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.brand-sub{font-size:11px;color:var(--nav-muted);font-family:var(--f-mono);margin-top:2px;overflow-wrap:anywhere}
.nav-new{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r);background:var(--primary);color:var(--on-primary);font-weight:600;text-decoration:none}
.nav-new kbd{margin-left:auto}
.nav-new:hover{background:var(--primary-hover)}
.nav-new.on{box-shadow:inset 0 0 0 2px var(--nav-ink)}
.rail-nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{margin:10px 8px 3px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--nav-muted);font-weight:600}
.rail-nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r);color:var(--nav-muted);text-decoration:none;font-weight:500}
.rail-nav a:hover{background:var(--nav-hover);color:var(--nav-ink)}
.rail-nav a.on{background:var(--nav-active);color:var(--nav-ink)}
.rail-nav a kbd{margin-left:auto;font-size:10px;opacity:.5}
.rail-foot{margin-top:auto;display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--nav-muted);padding:10px 6px 2px;border-top:1px solid var(--nav-line)}
.rail-foot .ic{width:15px;height:15px;margin-top:1px}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:52px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar .brand-mark,.topbar .m-only{display:none}
.top-t{flex:1;min-width:0}
.top-shop{display:none}
.top-title{font-size:16px;font-weight:600}
.top-info{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px;color:var(--muted)}
.top-info .chip{font-family:var(--f-mono)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.sdot.off{background:var(--warn)}
.view{width:100%;max-width:1400px;margin:0 auto;flex:1;padding-block:18px 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;outline:none}
.banner-wrap{width:100%;max-width:1400px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.banner-wrap:not(:empty){padding-block:12px 0}

.statusbar .keys{display:flex;gap:6px 14px;flex-wrap:wrap}

@media (max-width:860px){

  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}

  body[data-view="new"] .tabbar{display:none}

  h1{font-size:19px}
}

/* ---------- common pieces ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p.muted{font-size:12.5px;margin-top:2px}
.acts,.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card{padding:14px}
.card.flat{padding:10px}
.list-card,.panel{overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--head);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.panel-h a,.panel-h .link-btn{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--primary);text-decoration:none}
.panel-h a:hover{text-decoration:underline}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-head a{font-size:12.5px;color:var(--primary);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunken)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:var(--on-primary)}
.btn-danger:hover{filter:brightness(1.08);background:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:28px;padding:0 9px;font-size:12.5px}
.btn-lg{min-height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.btn kbd{margin-left:2px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--muted);flex:none;text-decoration:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.link-btn{border:0;background:none;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.file-btn{position:relative}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.in{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--raised);width:100%;min-width:0}
textarea.in{height:auto;padding:8px 10px;resize:vertical;min-height:58px;line-height:1.4}
.in:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent;background:var(--surface)}
.in::placeholder,.cell::placeholder{color:var(--muted);opacity:.8}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.in-xs{height:28px;padding:0 6px;font-size:12px}
select.in{padding-right:24px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.check input{margin-top:2px;width:15px;height:15px;accent-color:var(--primary);flex:none}
.inline-f{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.inline-f .in{width:64px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:1/-1}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:3px;font-size:11px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brass{background:var(--primary-soft);color:var(--primary)}
.chip.off{text-decoration:line-through;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-radius:var(--r-lg);border:1px solid transparent;background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.4}
.banner span{flex:1 1 240px;min-width:0}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--primary-soft);color:var(--primary)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:var(--raised)}
.empty h3{font-size:16px}
.empty p{color:var(--muted);max-width:62ch}
.empty-mini{padding:16px 14px;color:var(--muted);font-size:13px}
.loading{display:flex;align-items:center;gap:12px;padding:40px 0;color:var(--muted)}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .in{width:auto;flex:0 1 auto;height:34px}
.search{position:relative;flex:1 1 240px;min-width:0}
.search>.ic{position:absolute;left:10px;top:9px;color:var(--muted);pointer-events:none}

.custom-range{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.sumline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}

/* ---------- data tables (lists) ---------- */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:inherit;font-size:13px}
.list>.row:last-child{border-bottom:0}

.row-head{display:grid;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--head);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list .row-head>span{font-size:10.5px;color:var(--muted)}
@media (max-width:860px){.action-bar kbd,.qa kbd{display:none}}
.r-main{display:block;min-width:0}
.r-title{display:block;font-weight:600;overflow-wrap:anywhere}
.r-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.r-end{display:flex;align-items:center;gap:10px;justify-content:flex-end;text-align:right}
.r-amt{font-weight:600;white-space:nowrap}
.tbl .mono,.link-btn.mono{white-space:nowrap}
.bill-row{grid-template-columns:100px 132px minmax(0,1fr) 112px 104px 104px 92px}

/* ---------- modal & toast ---------- */

.modal{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(580px,100%);display:flex;flex-direction:column;margin:auto 0;min-width:0;border:1px solid var(--line)}

.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg);position:sticky;bottom:calc(-1 * max(28px,env(safe-area-inset-bottom,0px)))}
.foot-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;width:100%}
.confirm-msg{font-size:14px;line-height:1.5}
.login-wrap{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.login{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:12px}
.login-logo{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 4px;background:#fff;border-radius:6px;padding:6px}
.login .btn-primary{justify-content:center;height:40px}
.login .link-btn{align-self:center}
.login-msg{min-height:1.2em;margin:0;font-size:13px}
.login-h{font-size:17px;margin:2px 0 0}
.login .btn{justify-content:center;height:40px}
.top-out{margin-left:6px;flex:none}
.top-out .ic{width:16px;height:16px}
.rail-out{font:inherit;color:var(--nav-ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
@media (max-width:860px){.top-out{padding:0 8px;height:32px}.top-out .t-lbl{display:none}}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs[disabled]{opacity:.65}
.fs[disabled] .seg button,.fs[disabled] .in{cursor:not-allowed}
@media (max-width:640px){
  .modal-wrap{padding:max(12px,env(safe-area-inset-top,0px)) 0 0;align-items:flex-end}
  .modal,.modal-wide,.modal-sm{width:100%;border-radius:10px 10px 0 0;margin:0;max-height:100%;overflow:auto}
  .modal-head{border-radius:10px 10px 0 0}
  .modal-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .modal-foot{bottom:0;border-radius:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .foot-acts{justify-content:flex-start}
}
#toast-root{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){#toast-root{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:var(--r-lg);font-size:13px;box-shadow:var(--shadow);max-width:520px;transition:opacity .25s,transform .25s}
.toast.good{background:var(--good);color:var(--on-primary)}
.toast.bad{background:var(--bad);color:var(--on-primary)}
.toast.out{opacity:0;transform:translateY(6px)}

/* bill preview, party, reports, setup */
.bill-chips{display:flex;flex-wrap:wrap;gap:6px}
.paper-frame{background:var(--sunken);border-radius:var(--r-lg);padding:12px;overflow:hidden}
.paper-scale{width:794px;transform-origin:0 0}
.paper-scale .inv{box-shadow:var(--shadow)}
.party-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.party-due{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pd-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pay-for{font-weight:600}
.stock-line{font-size:13px;color:var(--ink-2);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}

.rep-card{padding:0;overflow:hidden}
.rep-card .card-head{padding:10px 14px;margin:0;background:var(--head);border-bottom:1px solid var(--line)}

.rep-card .rep-tools{padding:10px 14px}
.setup{display:flex;flex-direction:column;gap:14px}
.setup .card>.card-head{margin:-14px -14px 12px;padding:10px 14px;background:var(--head);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.setup-save{position:sticky;bottom:0;display:flex;justify-content:flex-end;padding:10px 0;background:linear-gradient(transparent,var(--bg) 35%)}

.logo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- printed documents (always paper colours) ---------- */
.inv{position:relative;width:794px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:11.5px;line-height:1.38;padding:30px 32px 24px}
.inv .mono{font-size:11px}
.inv-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--paper-ink)}
.inv-shop{display:flex;gap:12px;align-items:flex-start;min-width:0}
.inv-logo{max-width:96px;max-height:64px;object-fit:contain}
.inv-logo-wide{display:block;height:54px;width:auto;max-width:100%;margin:0 0 6px}
.inv-wm{position:absolute;left:50%;top:50%;width:400px;max-width:55%;height:auto;transform:translate(-50%,-50%);opacity:.08;mix-blend-mode:multiply;pointer-events:none;user-select:none}
.paper-scale .inv{min-height:1123px}
.inv-shopname{font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-bottom:2px}
.inv-tag{font-style:italic;color:var(--paper-muted)}
.inv-brands{font-size:10px;font-weight:600;letter-spacing:.04em;margin-top:3px;color:var(--paper-muted)}
.inv-title{text-align:right;flex:none;max-width:250px}
.inv-kind{font-size:16px;font-weight:700;letter-spacing:.12em}
.inv-copy{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px;color:var(--paper-muted)}
.inv-decl{font-size:10px;margin-top:4px;font-weight:600}
.inv-info{display:grid;grid-template-columns:1.3fr 1fr;border-bottom:1px solid var(--paper-line)}
.inv-to{padding:10px 14px 10px 0;border-right:1px solid var(--paper-line);min-width:0;overflow-wrap:anywhere}
.inv-meta{padding:10px 0 10px 14px}
.inv-meta table{width:100%;border-collapse:collapse}
.inv-meta td{padding:1.5px 0;vertical-align:top}
.inv-meta td:first-child{color:var(--paper-muted);width:44%}
.inv-meta td:last-child{text-align:right;font-weight:600}
.inv .plbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--paper-muted);margin-bottom:3px}
.inv .pnm{font-size:13.5px;font-weight:700}
.inv-items{width:100%;border-collapse:collapse;margin-top:12px}
.inv-items th{background:var(--paper-soft);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 5px;border:1px solid var(--paper-line);text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv-items th.sl{white-space:nowrap;text-align:center}
.inv-items td{padding:5px;border-left:1px solid var(--paper-line);border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-soft);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.inv-items .l{text-align:left}
.inv-items .c{text-align:center}
.inv-items .desc{overflow-wrap:anywhere;min-width:150px}
.inv-items .u{font-size:9.5px;color:var(--paper-muted)}
.inv-items tbody tr:last-child td{border-bottom:1px solid var(--paper-line)}
.inv-items.dcols th{font-size:8.5px;letter-spacing:.02em;padding:5px 3px;white-space:nowrap}
.inv-items.dcols td{font-size:10.5px;padding:4px 3px}
.inv-items.dcols .desc{min-width:118px}
.inv-items.dcols tfoot td{padding:5px 3px}
.inv-items tfoot td{border:1px solid var(--paper-line);font-weight:700;padding:6px 5px;background:var(--paper-soft);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv-bottom{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:12px}
.inv-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.inv-words{font-weight:600}
.inv-tax{width:100%;border-collapse:collapse;font-size:10px}
.inv-tax th,.inv-tax td{border:1px solid var(--paper-line);padding:3px 5px;text-align:right;font-variant-numeric:tabular-nums}
.inv-tax th{background:var(--paper-soft);font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv-tax .l{text-align:left}
.inv-small{font-size:10px;white-space:pre-line}
.inv-totals{width:100%;border-collapse:collapse}
.inv-totals td{padding:2.5px 0;text-align:right;font-variant-numeric:tabular-nums}
.inv-totals td:first-child{text-align:left}
.inv-totals tr.grand td{font-size:15px;font-weight:800;border-top:2px solid var(--paper-ink);border-bottom:2px solid var(--paper-ink);padding:6px 0}
.inv-totals tr.due td{font-weight:700}
.inv-qr{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:10px}
.inv-qr b{font-size:11px}
.inv-sign{margin-top:26px;text-align:right}
.inv-sign .sline{height:36px;border-bottom:1px solid var(--paper-line);margin:0 0 4px auto;width:62%}
.inv-sign{position:relative}
.inv-sign .sline.has-sig{height:auto;min-height:36px;display:flex;justify-content:center;align-items:flex-end;padding-top:2px;margin-bottom:10px}
.inv-sign .sline.has-sig img{display:block;height:62px;width:auto;max-width:100%;margin-bottom:-6px;mix-blend-mode:multiply}
.inv-sign .sig-stamp{position:absolute;left:-4px;bottom:-12px;width:124px;height:auto;mix-blend-mode:multiply}
.logo-prev.sig-prev{width:150px;height:72px}
.logo-prev.sig-prev img{width:auto;height:auto;max-width:140px;max-height:64px}
.inv-foot{margin-top:16px;padding-top:6px;border-top:1px solid var(--paper-line);font-size:9.5px;color:var(--paper-muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inv-cancel{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-22deg);font-size:88px;font-weight:800;letter-spacing:.12em;color:var(--bad);opacity:.16;pointer-events:none}
.rcpt{width:72mm;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:11px;line-height:1.32;padding:2mm 0}

.rcpt .r-logo{display:block;margin:0 auto 4px;height:40px;width:auto;max-width:100%;filter:grayscale(1) contrast(1.2)}

.rcpt .b{font-weight:700}
.rcpt .big{font-size:14px;font-weight:800}

.rcpt .r span:last-child{text-align:right;white-space:nowrap}

/* ---------- shop website (website copy): what customers see before staff log in ----------
   The shop's own signboard brought online: the logo's blue as the board, the orange strip of the visiting card,
   signboard lettering (Barlow Condensed), and a plumbing drawing of what the shop supplies. The rest stays quiet. */
body.site-on{background:#FFFFFF}
body.site-on>.shell,body.site-on>.tabbar,body.site-on>.savebar{display:none!important}
#site-root{--s-blue:#1F62BD;--s-blue-d:#1A54A3;--s-navy:#14295E;--s-orange:#E45420;--s-strip:#CC4A1C;--s-mist:#EEF3FA;--s-rule:#D3DCE8;--s-ink:#2A3A57;--s-muted:#56647F;
  --s-cond:"Barlow Condensed","Arial Narrow",var(--f-ui);--s-text:"Barlow",var(--f-ui);
  color-scheme:light;background:#FFFFFF;color:var(--s-ink);font-family:var(--s-text);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
#site-root a{color:inherit}
#site-root :focus-visible{outline:2px solid var(--s-blue);outline-offset:2px}
#site-root .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#site-root .s-wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
#site-root section{scroll-margin-top:5px}
#site-root .ic{width:18px;height:18px}
/* top bar */
#site-root .s-top{position:sticky;top:0;z-index:20;background:#FFFFFF;border-bottom:1px solid var(--s-rule)}
#site-root .s-top .s-wrap{display:flex;align-items:center;gap:24px;min-height:68px}
#site-root .s-home{display:block;flex:none;border-radius:4px;text-decoration:none}
#site-root .s-logo{display:block;height:40px;width:auto}
#site-root .s-brandtxt{font-family:var(--s-cond);font-weight:700;font-size:26px;text-transform:uppercase;color:var(--s-navy)}
#site-root .s-nav{display:flex;gap:2px;margin-left:auto}
#site-root .s-nav a{padding:8px 12px;border-radius:6px;color:var(--s-navy);font-weight:500;font-size:16px;text-decoration:none}
#site-root .s-nav a:hover{background:var(--s-mist)}
#site-root .s-staff{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--s-rule);border-radius:6px;background:#FFFFFF;color:var(--s-navy);font:600 15px/1 var(--s-text);text-decoration:none;white-space:nowrap}
#site-root .s-staff:hover{border-color:var(--s-navy)}
#site-root .s-staff .ic{width:16px;height:16px}
/* the board */
#site-root .s-board{background-color:var(--s-blue);background-image:linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px);background-size:32px 32px;color:#FFFFFF;overflow:hidden}
#site-root .s-board .s-wrap{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,10fr);gap:48px;align-items:center;padding-top:72px;padding-bottom:64px}
#site-root .s-name{font-family:var(--s-cond);font-weight:700;font-size:clamp(54px,8.4vw,112px);line-height:.88;letter-spacing:.01em;text-transform:uppercase;margin:0;color:#FFFFFF}
#site-root .s-name span{display:block}
#site-root .s-bar{display:block;width:96px;height:6px;background:var(--s-orange);margin:26px 0 22px}
#site-root .s-tag{font-family:var(--s-cond);font-weight:500;font-size:clamp(26px,3.1vw,38px);line-height:1.1;margin:0;max-width:17em;text-wrap:balance}
#site-root .s-deal{margin:16px 0 0;font-size:17px;line-height:1.5;color:rgba(255,255,255,.88);max-width:44ch}
#site-root .s-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
#site-root .s-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border-radius:6px;border:1.5px solid transparent;font:600 16px/1.2 var(--s-text);text-decoration:none;white-space:nowrap;cursor:pointer}
#site-root .s-btn .ic{width:19px;height:19px}
#site-root .s-btn.on-blue{background:#FFFFFF;color:var(--s-navy)}
#site-root .s-btn.on-blue:hover{background:#E6EEF9}
#site-root .s-btn.ghost{border-color:rgba(255,255,255,.7);color:#FFFFFF;background:transparent}
#site-root .s-btn.ghost:hover{background:rgba(255,255,255,.12)}
#site-root .s-btn.solid{background:var(--s-blue);color:#FFFFFF}
#site-root .s-btn.solid:hover{background:var(--s-blue-d)}
#site-root .s-btn.line{border-color:#AFC0D6;color:var(--s-navy);background:#FFFFFF}
#site-root .s-btn.line:hover{border-color:var(--s-navy)}
#site-root .s-board :focus-visible{outline-color:#FFFFFF;outline-offset:3px}
#site-root .s-art svg{display:block;width:100%;height:auto;max-width:560px;margin-left:auto}
#site-root .s-art .p{fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#site-root .s-art .f,#site-root .s-art .fx{fill:none;stroke:#FFFFFF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#site-root .s-art .fx{stroke-opacity:.55}
#site-root .s-art .vb{fill:var(--s-blue)}
#site-root .s-art .j{fill:#FFFFFF}
#site-root .s-art .tl{fill:#FFFFFF;fill-opacity:.92;font-family:var(--s-text);font-weight:500;font-size:13px}
#site-root .s-art .gl{fill:none;stroke:#FFFFFF;stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:2 5}
#site-root .s-art .wv{fill:none;stroke:#FFFFFF;stroke-opacity:.7;stroke-width:1.4}
#site-root .s-art .sp{fill:none;stroke:#FFFFFF;stroke-opacity:.8;stroke-width:1.4;stroke-linecap:round}
#site-root .s-art .dr{fill:none;stroke:#FFFFFF;stroke-opacity:.55;stroke-width:1.6;stroke-dasharray:7 6}
@media (prefers-reduced-motion:no-preference){
  #site-root .s-art .p,#site-root .s-art .f{stroke-dasharray:1;stroke-dashoffset:1;animation:sDraw .9s cubic-bezier(.55,0,.25,1) forwards;animation-delay:var(--d,0s)}
  #site-root .s-art .fade{opacity:0;animation:sFade .6s ease forwards;animation-delay:var(--d,2s)}
}
@keyframes sDraw{to{stroke-dashoffset:0}}
@keyframes sFade{to{opacity:1}}
/* the orange strip of the visiting card */
#site-root .s-strip{background:var(--s-strip);color:#FFFFFF;font-size:15.5px;font-weight:500;line-height:1.45}
#site-root .s-strip .s-wrap{display:flex;flex-wrap:wrap;gap:6px 36px;padding-top:13px;padding-bottom:13px}
#site-root .s-strip b{font-weight:600;letter-spacing:.03em}
/* sections */
#site-root .s-sec{padding:88px 0}
#site-root .s-sec.mist{background:var(--s-mist)}
#site-root .s-sec.plain+.s-sec.plain,#site-root .s-sec.plain+[hidden]+.s-sec.plain{border-top:1px solid var(--s-rule)}
#site-root .s-h2{font-family:var(--s-cond);font-weight:600;font-size:clamp(34px,4.2vw,46px);line-height:1.02;color:var(--s-navy);margin:0}
#site-root .s-lead{margin:12px 0 0;color:var(--s-muted);max-width:56ch}
#site-root .s-head{margin-bottom:40px}
/* product index, ruled like a trade catalogue */
#site-root .s-cat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;margin:0;padding:0;border-top:1px solid var(--s-rule);border-left:1px solid var(--s-rule)}
#site-root .s-cat li{border-right:1px solid var(--s-rule);border-bottom:1px solid var(--s-rule);padding:26px 24px 28px}
#site-root .s-cat svg{display:block;width:44px;height:44px;color:var(--s-blue);margin-bottom:18px}
#site-root .s-cat h3{font-family:var(--s-cond);font-weight:600;font-size:24px;line-height:1.1;color:var(--s-navy);margin:0 0 6px}
#site-root .s-cat p{margin:0;font-size:15.5px;line-height:1.5;color:var(--s-muted)}
/* photos */
#site-root .s-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;gap:12px}
#site-root .s-gal.c1{grid-template-columns:minmax(0,1fr)}
#site-root .s-gal.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
#site-root .s-ph{position:relative;display:block;width:100%;padding:0;border:0;border-radius:4px;overflow:hidden;background:#D9E2EE;aspect-ratio:4/3;cursor:zoom-in}
#site-root .s-gal.c1 .s-ph{aspect-ratio:16/9;max-height:620px}
#site-root .s-ph.wait{cursor:default}
@media (min-width:721px){#site-root .s-ph.w3{grid-column:span 2;aspect-ratio:8/3}}
@media (max-width:720px){#site-root .s-ph.w2{grid-column:span 2;aspect-ratio:8/3}}
#site-root .s-ph img{display:block;width:100%;height:100%;object-fit:cover}
#site-root .s-cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(20,41,94,.88);color:#FFFFFF;font-size:14px;line-height:1.3;padding:5px 10px;border-radius:3px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* about */
#site-root .s-about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
#site-root .s-who{display:flex;gap:20px;align-items:flex-start;margin-top:28px}
#site-root .s-who img{width:132px;height:164px;object-fit:cover;border-radius:4px;flex:none;background:#D9E2EE}
#site-root .s-who h3{font-family:var(--s-cond);font-weight:600;font-size:32px;line-height:1.05;color:var(--s-navy);margin:0}
#site-root .s-role{margin:4px 0 18px;color:var(--s-muted)}
#site-root .s-about-t{padding-top:6px}
#site-root .s-about-t p{margin:0 0 16px;max-width:60ch}
#site-root .s-prom{list-style:none;margin:28px 0 0;padding:24px 0 0;border-top:1px solid var(--s-rule);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
#site-root .s-prom li{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--s-navy);line-height:1.4}
#site-root .s-prom .ic{width:20px;height:20px;color:var(--s-orange);margin-top:1px;stroke-width:2.2}
/* visit */
#site-root .s-visit{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:stretch}
#site-root .s-addr{font-style:normal;font-size:21px;line-height:1.45;font-weight:500;color:var(--s-navy);margin:22px 0 0}
#site-root .s-hours{width:100%;border-collapse:collapse;margin:22px 0 0;font-size:16px}
#site-root .s-hours th,#site-root .s-hours td{padding:9px 0;border-bottom:1px solid var(--s-rule);font-weight:400;text-align:left;vertical-align:top}
#site-root .s-hours td{text-align:right;font-weight:500;color:var(--s-navy);padding-left:16px}
#site-root .s-reach{margin:22px 0 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#site-root .s-reach a{display:inline-flex;align-items:center;gap:8px;color:var(--s-navy);font-weight:500;text-decoration:none}
#site-root .s-reach a:hover span{text-decoration:underline}
#site-root .s-visit .s-cta{margin-top:28px}
#site-root .s-map{position:relative;min-height:420px;border-radius:4px;overflow:hidden;border:1px solid var(--s-rule);background:#DDE5F0}
#site-root .s-map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* enquiry */
#site-root .s-enq{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
#site-root .s-form{display:grid;gap:16px}
#site-root .s-form label{display:block;font-weight:600;font-size:15px;color:var(--s-navy);margin-bottom:6px}
#site-root .s-in{display:block;width:100%;border:1px solid #AFC0D6;border-radius:6px;background:#FFFFFF;color:var(--s-navy);font:400 17px/1.45 var(--s-text);padding:11px 14px}
#site-root textarea.s-in{min-height:150px;resize:vertical}
#site-root .s-in::placeholder{color:#8593AA}
#site-root .s-in:focus{outline:2px solid var(--s-blue);outline-offset:0;border-color:var(--s-blue)}
#site-root .s-form .s-btn{justify-self:start}
#site-root .s-note{margin:0;font-size:15px;color:var(--s-strip);min-height:1.4em}
/* footer */
#site-root .s-foot{background:var(--s-navy);color:rgba(255,255,255,.82);font-size:15.5px;line-height:1.6;padding:56px 0 32px}
#site-root .s-foot .s-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:32px}
#site-root .s-fname{font-family:var(--s-cond);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:#FFFFFF;margin:0 0 8px}
#site-root .s-foot h3{font-size:15.5px;font-weight:600;color:#FFFFFF;margin:0 0 6px}
#site-root .s-foot p{margin:0}
#site-root .s-foot a{color:#FFFFFF}
#site-root .s-fine{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;border-top:1px solid rgba(255,255,255,.16);padding-top:20px;margin-top:12px;font-size:14px;color:rgba(255,255,255,.68)}
#site-root .s-fine button{border:0;background:none;padding:0;color:#FFFFFF;font:inherit;text-decoration:underline;text-underline-offset:3px}
#site-root .s-foot :focus-visible{outline-color:#FFFFFF}
#site-root .s-dock{display:none}
@media (max-width:1000px){#site-root .s-cat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  #site-root .s-board .s-wrap{grid-template-columns:minmax(0,1fr);gap:36px;padding-top:48px;padding-bottom:44px}
  #site-root .s-art svg{margin:0 auto}
}
@media (max-width:900px){#site-root .s-nav{display:none}#site-root .s-staff{margin-left:auto}}
@media (max-width:860px){
  #site-root .s-about,#site-root .s-visit,#site-root .s-enq{grid-template-columns:minmax(0,1fr);gap:28px}
  #site-root .s-map{min-height:300px}
  #site-root .s-foot .s-wrap{grid-template-columns:minmax(0,1fr);gap:24px}
}
@media (max-width:720px){
  #site-root .s-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #site-root .s-sec{padding:60px 0}
  #site-root .s-head{margin-bottom:28px}
  #site-root .s-gal,#site-root .s-gal.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #site-root .s-gal.c1{grid-template-columns:minmax(0,1fr)}
  #site-root .s-btn{min-height:46px;padding:0 16px}
  #site-root{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  #site-root .s-dock{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#FFFFFF;border-top:1px solid var(--s-rule);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  #site-root .s-dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;border-radius:6px;color:var(--s-navy);font:600 13px/1.2 var(--s-text);text-decoration:none}
  #site-root .s-dock a.solid{background:var(--s-blue);color:#FFFFFF}
  #site-root .s-dock .ic{width:20px;height:20px}
}
@media (max-width:560px){
  #site-root .s-cat{grid-template-columns:minmax(0,1fr)}
  #site-root .s-cat li{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:16px;padding:18px 16px}
  #site-root .s-cat svg{grid-row:span 2;width:36px;height:36px;margin:2px 0 0}
  #site-root .s-art .tl{display:none}
  #site-root .s-art svg{max-width:340px}
  #site-root .s-prom{grid-template-columns:minmax(0,1fr)}
  #site-root .s-who img{width:104px;height:130px}
}
@media (max-width:420px){#site-root .s-logo{height:32px}#site-root .s-staff{padding:0 11px;font-size:14px}#site-root .s-top .s-wrap{gap:12px}}
/* photo viewer */
.s-lb{position:fixed;inset:0;z-index:95;background:#0B1530;color:#FFFFFF;display:grid;grid-template-rows:auto minmax(0,1fr) auto;font-family:"Barlow",var(--f-ui)}
.s-lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:15px}
.s-lb-stage{position:relative;min-height:0}
.s-lb-stage img{position:absolute;top:0;bottom:0;left:16px;width:calc(100% - 32px);height:100%;object-fit:contain}
.s-lb-bot{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.s-lb-cap{margin:0;text-align:center;font-size:16px;line-height:1.4}
.s-lb-x,.s-lb-nav{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#FFFFFF;cursor:pointer}
.s-lb-x:hover,.s-lb-nav:hover{background:rgba(255,255,255,.22)}
.s-lb-nav[hidden]{display:inline-grid;visibility:hidden}
.s-lb .ic{width:22px;height:22px}
.s-lb :focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
/* staff login over the shop website */
.login-wrap.over{background:rgba(9,18,40,.62)}
.login{position:relative}
.login .lg-x{position:absolute;top:8px;right:8px}
.login-wrap.over .login-logo{margin-top:8px}
/* Website screen */
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ws-ph{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised);overflow:hidden;display:flex;flex-direction:column}
.ws-ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunken)}
.ws-ph-bar{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 10px}
.ws-ph-bar .hint{margin-right:auto}
.ws-ph-bar .icon-btn:disabled{opacity:.35;cursor:default}
.ws-ph .in{border-radius:0;border-width:1px 0 0}
.logo-prev.ws-own{width:96px;height:120px}
.logo-prev.ws-own img{width:100%;height:100%;object-fit:cover}
.ws-rules{white-space:pre;font-family:var(--f-mono);font-size:12px;line-height:1.5;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow:auto;margin:10px 0 0;color:var(--ink)}
#print-root{display:none}
@media print{
  :root{padding:0!important}
  body{background:var(--paper)!important}
  body.printing>*:not(#print-root){display:none!important}
  body.printing::before{display:none!important}
  body.printing #print-root{display:block!important}
  #print-root .inv{width:auto;padding:0}
  #print-root .inv-wm{position:fixed;width:105mm;max-width:none}
  .inv-items thead{display:table-header-group}
  .inv-items tr,.inv-bottom{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function inWords(amount){const a=Math.abs(r2(amount));let rs=Math.floor(a);let ps=Math.round((a-rs)*100);if(ps===100){rs+=1;ps=0;}let s="Rupees "+wIndian(rs);if(ps)s+=" and "+w2(ps)+" Paise";return s+" Only";}

/* MRP par discount (company-bill style). The rate is the MRP, which already has GST in it. The customer's X% off MRP is
   printed as one bill discount that also takes the GST out of the MRP: 100 − (100 − X) ÷ (1 + GST%).
   At 18% GST, 45% off MRP prints as 53.39%. GST is then added on the taxable value, so the customer pays MRP − X%.
   The % is rounded UP to 2 decimals, so a bill never comes to more than MRP − X% (or above MRP at 0%);
   rounding down, as some company bills do (53.38%), charges the customer a few rupees extra. */
function mrpDisc(x,g){x=Math.min(100,Math.max(0,num(x)));g=num(g);if(!(g>0))return x;return Math.min(100,r2(Math.ceil((100-(100-x)*100/(100+g))*100-1e-7)/100));}
/* One bill. lines: [{qty,rate,disc,gst,...}]; o: {incl, mrp, gstOn, inter, roundOff}
   o.mrp: line disc is the discount on MRP; the bill discount (eff) is worked out with mrpDisc and GST goes on top. */
function calcBill(lines,o){
  const mrpOn=!!o.mrp&&!o.incl;
  let gross=0,disc=0,off=0,taxable=0,cgst=0,sgst=0,igst=0,qty=0;
  const out=lines.map(l=>{
    const q=num(l.qty),rate=num(l.rate),dp=Math.min(100,Math.max(0,num(l.disc)));
    const g=o.gstOn?num(l.gst):0;
    const dlv=l.kind==="delivery",mrp=mrpOn&&!dlv;
    const ep=mrp?mrpDisc(dp,g):dp;
    const lg=r2(q*rate),ld=r2(lg*ep/100),net=r2(lg-ld);
    /* In MRP style a delivery charge with GST is taken as GST-inclusive, like the MRPs */
    const inc=o.incl||(mrpOn&&dlv);
    let tx=net,c=0,s=0,i=0;
    if(o.gstOn&&g>0){
      if(inc){
        /* Price includes GST: find the taxable value (within 2 paise) whose taxable + tax is exactly the price.
           If none exists, tax = price − taxable, so the line still adds up to the price. */
        const t0=r2(net/(1+g/100));
        const back=t=>o.inter?r2(t+r2(t*g/100)):r2(t+2*r2(t*g/200));
        let fit=back(t0)===net?t0:null;
        if(fit===null)for(const d of [-0.01,0.01,-0.02,0.02]){const t=r2(t0+d);if(back(t)===net){fit=t;break;}}
        if(fit!==null){tx=fit;if(o.inter)i=r2(tx*g/100);else{c=r2(tx*g/200);s=c;}}
        else{tx=t0;const tax=r2(net-tx);if(o.inter)i=tax;else{c=r2(tax/2);s=r2(tax-c);}}
      }
      else if(o.inter)i=r2(tx*g/100);
      else{c=r2(tx*g/200);s=c;}
    }
    const amt=r2(tx+c+s+i);
    gross+=lg;disc+=ld;off+=mrp?r2(lg*dp/100):ld;taxable+=tx;cgst+=c;sgst+=s;igst+=i;if(!dlv)qty+=q;
    const r=Object.assign({},l,{qty:q,rate,disc:dp,gst:g,gross:lg,discAmt:ld,taxable:tx,cgst:c,sgst:s,igst:i,amount:amt});
    if(mrp)r.eff=ep;else delete r.eff;
    return r;
  });
  /* o.extra: a charge outside GST (delivery charged without GST), added after the tax */
  const extra=r2(num(o.extra));
  const exact=r2(taxable+cgst+sgst+igst+extra);
  const total=o.roundOff?Math.round(exact):exact;
  const sum={qty:r2(qty),gross:r2(gross),discount:r2(disc),taxable:r2(taxable),cgst:r2(cgst),sgst:r2(sgst),igst:r2(igst),other:extra,roundoff:r2(total-exact),total:r2(total)};
  /* mrpOff: what the customer saves on the MRP (the bill discount also holds the GST part of the MRP) */
  if(mrpOn)sum.mrpOff=r2(off);
  return {lines:out,sum};
}
/* For printing: the Disc % shown on a bill line, and the line's Amount (qty × rate), Disc % and Discount ₹.
   In MRP style a delivery line is GST-inclusive, so it shows its value before GST and no discount. */
const lineDisc=l=>num(l&&l.eff!=null?l.eff:l&&l.disc);
function lineView(l,b,gstOn){
  if(b.mrp&&gstOn&&l.kind==="delivery"){const t=num(l.taxable);return {rate:t,amt:t,dp:0,da:0};}
  const rate=num(l.rate),amt=r2(num(l.qty)*rate),dp=lineDisc(l);return {rate,amt,dp,da:r2(amt*dp/100)};
}
function rateSummary(lines){const m=new Map();for(const l of lines){const k=num(l.gst);const x=m.get(k)||{gst:k,taxable:0,cgst:0,sgst:0,igst:0};x.taxable+=num(l.taxable);x.cgst+=num(l.cgst);x.sgst+=num(l.sgst);x.igst+=num(l.igst);m.set(k,x);}return [...m.values()].sort((a,b)=>a.gst-b.gst).map(x=>({gst:x.gst,taxable:r2(x.taxable),cgst:r2(x.cgst),sgst:r2(x.sgst),igst:r2(x.igst)}));}

/* Stock: opening + stock in + purchases marked "add to stock" − sold on active bills */
function computeStock(items,bills,moves,purchases){
  const st=new Map(),inq=new Map(),sold=new Map();
  for(const it of items){st.set(it.id,num(it.open));inq.set(it.id,0);sold.set(it.id,0);}
  for(const m of moves){if(st.has(m.item)){st.set(m.item,st.get(m.item)+num(m.qty));inq.set(m.item,inq.get(m.item)+num(m.qty));}}
  for(const p of purchases||[]){if(p.status==="cancelled"||!p.stock)continue;for(const l of p.lines||[]){if(l.item&&st.has(l.item)){st.set(l.item,st.get(l.item)+num(l.qty));inq.set(l.item,inq.get(l.item)+num(l.qty));}}}
  for(const b of bills){if(b.type!=="INV"||b.status==="cancelled")continue;for(const l of b.lines||[]){if(l.item&&st.has(l.item)){st.set(l.item,st.get(l.item)-num(l.qty));sold.set(l.item,sold.get(l.item)+num(l.qty));}}}
  return {stock:st,inq,sold};
}
/* Udhaar: payments settle the opening balance first, then the oldest bills */
function computeDues(parties,bills,payments){
  const billDue=new Map(),partyDue=new Map(),partyLast=new Map(),P=new Map();
  for(const p of parties)P.set(p.id,{open:num(p.open),deb:[],cred:0});
  for(const b of bills){
    if(b.type!=="INV"||b.status==="cancelled")continue;
    const due=r2(num(b.sum&&b.sum.total)-num(b.pay&&b.pay.paid));
    const pid=b.party&&b.party.id;
    if(pid&&P.has(pid)){P.get(pid).deb.push({b,due});const l=partyLast.get(pid);if(!l||b.date>l)partyLast.set(pid,b.date);}
    else billDue.set(b.id,Math.max(0,due));
  }
  for(const p of payments){if(P.has(p.party))P.get(p.party).cred+=num(p.amount);}
  for(const [pid,x] of P){
    let credit=x.cred+Math.max(0,-x.open);let total=x.open-x.cred;
    credit-=Math.min(Math.max(0,x.open),credit);
    x.deb.sort((a,b)=>(a.b.date+pad(a.b.seq||0,6)).localeCompare(b.b.date+pad(b.b.seq||0,6)));
    for(const d of x.deb)if(d.due<0)credit+=-d.due;
    for(const d of x.deb){total+=d.due;if(d.due<=0){billDue.set(d.b.id,0);continue;}const pay=Math.min(d.due,credit);credit-=pay;billDue.set(d.b.id,r2(d.due-pay));}
    partyDue.set(pid,r2(total));
  }
  return {billDue,partyDue,partyLast};
}

const libP={},libFail={};
function loadLib(name){
  const L=LIBS[name];if(L.test())return Promise.resolve(true);
  if(libP[name])return libP[name];
  if(libFail[name]&&Date.now()-libFail[name]<60000)return Promise.resolve(false);
  libP[name]=(async()=>{
    for(const u of L.urls){
      const ok=await new Promise(res=>{const s=document.createElement("script");s.src=u;s.async=true;let done=false;const fin=v=>{if(!done){done=true;res(v);}};s.onload=()=>fin(true);s.onerror=()=>{s.remove();fin(false);};document.head.appendChild(s);setTimeout(()=>fin(false),15000);});
      if(ok&&L.test()){libP[name]=null;return true;}
    }
    libP[name]=null;libFail[name]=Date.now();return false;
  })();
  return libP[name];
}
function qrSvg(text,px){
  if(!text||typeof window.qrcode!=="function")return "";
  try{const q=window.qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=3,sz=n+m*2;let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
    return '<svg class="qr" viewBox="0 0 '+sz+" "+sz+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges" role="img" aria-label="UPI QR code"><rect width="'+sz+'" height="'+sz+'" fill="#FFFFFF"/><path d="'+d+'" fill="#000000"/></svg>';
  }catch(e){return "";}
}

/* Local: IndexedDB in this browser (falls back to localStorage, then memory). Same document paths as the cloud store. */
function makeLocalStore(){
  const DBN="sanitary-billing",LSK="sanitary-billing-v1";let kind="mem",idb=null;const mem=new Map();
  let bc=null;try{bc=new BroadcastChannel("sanitary-billing");}catch(e){bc=null;}
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const os=mode=>idb.transaction("docs",mode).objectStore("docs");
  const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LSK)||"{}")||{};}catch(e){return {};}};
  const notify=()=>{try{if(bc)bc.postMessage({from:TAB_ID});}catch(e){}};
  return {
    mode:"local",
    get kind(){return kind;},
    async init(){
      try{
        idb=await new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("docs",{keyPath:"path"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"));setTimeout(()=>rej(new Error("timeout")),5000);});
        await req(os("readonly").count());kind="idb";
      }catch(e){
        try{localStorage.setItem("__sb","1");localStorage.removeItem("__sb");kind="ls";}catch(e2){kind="mem";}
      }
    },
    async loadAll(){
      if(kind==="idb"){try{return await req(os("readonly").getAll());}catch(e){return [];}}
      if(kind==="ls")return Object.entries(lsAll()).map(([path,data])=>({path,data}));
      return [...mem].map(([path,data])=>({path,data}));
    },
    async put(path,data){
      if(kind==="idb")await req(os("readwrite").put({path,data}));
      else if(kind==="ls"){const o=lsAll();o[path]=data;localStorage.setItem(LSK,JSON.stringify(o));}
      else mem.set(path,data);
      notify();
    },
    async del(path){
      if(kind==="idb")await req(os("readwrite").delete(path));
      else if(kind==="ls"){const o=lsAll();delete o[path];localStorage.setItem(LSK,JSON.stringify(o));}
      else mem.delete(path);
      notify();
    },
    dayEntry(date,k,id,obj,full){return this.put("days/"+date,full);},
    async alloc(series,minNext){return minNext;},
    async release(){return true;},
    watch(cb){if(bc)bc.onmessage=ev=>{if(ev.data&&ev.data.from!==TAB_ID)cb();};}
  };
}

function makeCloudStore(db){
  const chains=new Map(),unsubs=[];
  const enqueue=(path,fn)=>{const p=(chains.get(path)||Promise.resolve()).catch(()=>{}).then(fn);chains.set(path,p);return p;};
  const retry=async fn=>{try{return await fn();}catch(e){if(e&&e.code==="unavailable"){await sleep(400+Math.random()*700);return await fn();}throw e;}};
  return {
    mode:"cloud",kind:"cloud",
    subscribe(h){
      unsubs.push(db.collection("items").onSnapshot(h.items,h.error));
      unsubs.push(db.collection("parties").onSnapshot(h.parties,h.error));
      unsubs.push(db.collection("days").onSnapshot(h.days,h.error));
      unsubs.push(db.doc("meta/settings").onSnapshot(h.settings,h.error));
    },
    put(path,data){return enqueue(path,()=>retry(()=>db.doc(path).set(data)));},
    del(path){return enqueue(path,()=>retry(()=>db.doc(path).delete()));},
    dayEntry(date,k,id,obj){
      const path="days/"+date;
      return enqueue(path,async()=>{
        const ref=db.doc(path);
        try{await retry(()=>ref.update({[k]:{[id]:obj}}));}
        catch(e){
          if(!e||e.code!=="invalid_argument")throw e;
          const snap=await ref.get();if(snap.exists)throw e;
          const body={date,bills:{},payments:{},stock:{},purchases:{}};body[k]=body[k]||{};body[k][id]=obj;
          await retry(()=>ref.set(body));
        }
      });
    },
    /* Bill numbers: a short lease on meta/lock_<series> so two devices never take the same number. */
    async alloc(series,minNext){
      const lock=db.doc("meta/lock_"+series),ctr=db.doc("meta/ctr_"+series);const until=Date.now()+20000;
      while(Date.now()<until){
        let r=null;
        try{r=await lock.acquire({holder:TAB_ID,ttlMs:5000});}
        catch(e){const c=e&&e.code;if(c==="capability_removed"||c==="capability_disabled"||c==="not_granted")return minNext;if(c!=="unavailable"&&c!=="resource_exhausted")throw e;}
        if(r&&r.acquired){
          const snap=await retry(()=>ctr.get());const last=snap.exists?num((snap.data()||{}).last):0;
          const next=Math.max(last+1,minNext);
          await retry(()=>ctr.set({last:next,series,at:new Date().toISOString()}));
          return next;
        }
        const w=r&&r.expiresAt?Date.parse(r.expiresAt)-Date.now():600;
        await sleep(Math.min(2500,Math.max(250,w||600))+Math.random()*250);
      }
      throw Object.assign(new Error("busy"),{code:"busy"});
    },
    /* After the latest bill of a series is deleted, step the counter back so its number is used again. */
    async release(series,seq){
      const lock=db.doc("meta/lock_"+series),ctr=db.doc("meta/ctr_"+series);
      const r=await lock.acquire({holder:TAB_ID,ttlMs:5000});if(!r||!r.acquired)return false;
      const snap=await retry(()=>ctr.get());const last=snap.exists?num((snap.data()||{}).last):0;
      if(last===seq)await retry(()=>ctr.set({last:seq-1,series,at:new Date().toISOString()}));
      return true;
    },
    watch(){}
  };
}
function ingest(docs){
  const items=new Map(),parties=new Map(),days=new Map();let settings=null;
  for(const d of docs){if(!d||!d.data)continue;const i=d.path.indexOf("/");const c=d.path.slice(0,i),id=d.path.slice(i+1);
    if(c==="items")items.set(id,Object.assign({},d.data,{id}));
    else if(c==="parties")parties.set(id,Object.assign({},d.data,{id}));
    else if(c==="days")days.set(id,d.data);
    else if(d.path==="meta/settings")settings=d.data;}
  S.items=items;S.parties=parties;S.days=days;S.settings=withDefaults(settings);
}
function derive(){
  const bills=[],pays=[],moves=[],purs=[];
  for(const d of S.days.values()){
    if(!d)continue;
    for(const k in d.bills||{}){const b=d.bills[k];if(b&&b.id)bills.push(b);}
    for(const k in d.payments||{}){const p=d.payments[k];if(p&&p.id)pays.push(p);}
    for(const k in d.stock||{}){const m=d.stock[k];if(m&&m.id)moves.push(m);}
    for(const k in d.purchases||{}){const p=d.purchases[k];if(p&&p.id)purs.push(p);}
  }
  purs.sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  S.purchases=purs;S.purchasesById=new Map(purs.map(p=>[p.id,p]));
  const key=b=>b.date+(b.time||"00:00")+pad(Math.floor(num(b.created)),14)+pad(b.seq||0,9);
  bills.sort((a,b)=>key(b).localeCompare(key(a)));
  pays.sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  S.bills=bills;S.billsById=new Map(bills.map(b=>[b.id,b]));S.payments=pays;S.moves=moves;
  S.itemsArr=[...S.items.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  S.partiesArr=[...S.parties.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const st=computeStock(S.itemsArr,bills,moves,purs);S.stock=st.stock;S.stockIn=st.inq;S.sold=st.sold;
  const du=computeDues(S.partiesArr,bills,pays);S.billDue=du.billDue;S.partyDue=du.partyDue;S.partyLast=du.partyLast;
}

/* ---------- writes: update memory first, then persist ---------- */
function errText(e){const c=e&&e.code;
  if(c==="quota_exceeded")return "Storage is full. Download a backup and clear old data.";
  if(c==="unavailable")return "Network problem. Please try again.";
  if(c==="invalid_argument")return "Could not save. You may have view-only access.";
  if(c==="busy")return "Another device is saving a bill right now. Try again.";
  if(c==="revoked")return "Access to this page changed. Reload to continue.";
  if(c==="denied")return "This login is not allowed to save. Add this email in the Firestore rules.";
  if(c==="unauthenticated")return "Please log in again.";
  return "Could not save"+(e&&e.message?": "+e.message:".");}
function handleWriteError(e){console.error(e);const c=e&&e.code;if(S.mode==="cloud"&&c==="invalid_argument"&&S.canWrite!==true){S.readOnly=true;renderChrome();}toast(errText(e),"bad");}
async function persist(fn){try{await fn();return true;}catch(e){handleWriteError(e);return false;}}
function guardWrite(){if(S.readOnly){toast("You have view-only access here.","bad");return false;}return true;}
function putItem(it){it.updated=Date.now();S.items.set(it.id,it);derive();scheduleRender();return persist(()=>S.store.put("items/"+it.id,clone(it)));}
function delItem(id){S.items.delete(id);derive();scheduleRender();return persist(()=>S.store.del("items/"+id));}
function putParty(p){p.updated=Date.now();S.parties.set(p.id,p);derive();scheduleRender();return persist(()=>S.store.put("parties/"+p.id,clone(p)));}
function delParty(id){S.parties.delete(id);derive();scheduleRender();return persist(()=>S.store.del("parties/"+id));}
function putDay(date,kind,id,obj){
  const v=obj?clone(obj):null;const d=S.days.get(date)||{date,bills:{},payments:{},stock:{}};
  const nd=Object.assign({},d,{[kind]:Object.assign({},d[kind]||{},{[id]:v})});
  S.days.set(date,nd);derive();scheduleRender();
  return persist(()=>S.store.dayEntry(date,kind,id,v,nd));
}
/* Settings saved before the logo and UPI QR were added (no rev) get the shop logo and UPI ID filled in.
   Once settings are saved again they carry rev 2, so a logo or UPI ID removed later stays removed. */
function withDefaults(raw){
  const st=Object.assign({},DEFAULTS,raw||{});
  if(raw&&!(num(raw.rev)>=2)){
    if(!st.logo){st.logo=DEFAULTS.logo;st.logoW=DEFAULTS.logoW;st.logoH=DEFAULTS.logoH;}
    if(!String(st.upi||"").trim())st.upi=DEFAULTS.upi;
  }
  /* rev 3: the shop's PhonePe merchant QR replaces the earlier personal UPI ID, and the QR prints on bills */
  if(raw&&!(num(raw.rev)>=3)){
    const u=String(st.upi||"").trim();
    if(!u||u==="7738342931-2@ibl"){st.upi=DEFAULTS.upi;st.upiQr=DEFAULTS.upiQr;}
    st.printQr=true;
  }
  if(raw&&raw.logoIcon===undefined)st.logoIcon=st.logo===DEFAULTS.logo?DEFAULTS.logoIcon:"";
  st.rev=3;return st;
}
const logoRatio=st=>st.logo&&num(st.logoW)>0&&num(st.logoH)>0?num(st.logoW)/num(st.logoH):0;
/* A wide logo (like the Mahavir one) already carries the shop name, so it replaces the name text on bills. */
const logoWide=st=>logoRatio(st)>=2;
const imgFormat=u=>/^data:image\/jpe?g/i.test(String(u||""))?"JPEG":"PNG";
function putSettings(st){S.settings=Object.assign({},DEFAULTS,st);renderChrome();return persist(()=>S.store.put("meta/settings",clone(S.settings)));}

/* The website copy (index.html on GitHub Pages) sets window.FIREBASE_CONFIG. Bills are then kept in the shop's own
   Firebase project (Cloud Firestore, free plan) under FIREBASE_ROOT, shared by every device that logs in. */
/* The SDK is not part of the page: it is loaded when staff log in, so visitors of the shop website do not download it. */
const FB=ENV==="standalone"&&window.FIREBASE_CONFIG&&typeof window.FIREBASE_CONFIG==="object"?window.FIREBASE_CONFIG:null;
const FB_ROOT=String(window.FIREBASE_ROOT||"shops/main").replace(/^\/+|\/+$/g,"");
/* Two kinds of login on the website copy. Owner: all day-to-day work. Developer: also GST settings, bill numbering,
   restoring a backup and erasing data. Emails listed in FIREBASE_ROLES.developer may use the Developer login. */
const FB_ROLES=window.FIREBASE_ROLES&&typeof window.FIREBASE_ROLES==="object"?window.FIREBASE_ROLES:null;
const ROLE_LABEL={owner:"Owner",developer:"Developer"};
const isDevEmail=e=>{if(!FB_ROLES)return false;const em=String(e||"").trim().toLowerCase();const L=a=>(a||[]).map(x=>String(x).trim().toLowerCase());
  if(Array.isArray(FB_ROLES.developer))return L(FB_ROLES.developer).includes(em);
  if(Array.isArray(FB_ROLES.owner))return !L(FB_ROLES.owner).includes(em);
  return false;};
const isDev=()=>S.role!=="owner";
function rolePick(){try{return localStorage.getItem("mb-role")==="developer"?"developer":"owner";}catch(e){return "owner";}}
function fbErr(e){const c=String(e&&e.code||"").replace(/^firestore\//,"").replace(/-/g,"_");const x=new Error(e&&e.message||"error");x.code=c==="permission_denied"?"denied":c==="resource_exhausted"?"quota_exceeded":c;return x;}
function makeFirebaseStore(fs){
  const FV=firebase.firestore.FieldValue,FP=firebase.firestore.FieldPath;
  const ref=p=>fs.doc(FB_ROOT+"/"+p);
  /* Firestore confirms a write once the server has it. Wait up to 2.5 s; after that the write is already in this
     device's copy and is sent by itself when the network is back, so the screen never hangs on a slow line. */
  const soft=pr=>new Promise((res,rej)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;res();}},2500);
    pr.then(()=>{if(!done){done=true;clearTimeout(t);res();}},e=>{const x=fbErr(e);if(!done){done=true;clearTimeout(t);rej(x);}else handleWriteError(x);});});
  const offline=ms=>sleep(ms).then(()=>{throw Object.assign(new Error("offline"),{code:"offline"});});
  return {
    mode:"cloud",kind:"cloud",
    subscribe(h){
      const col=n=>fs.collection(FB_ROOT+"/"+n);const err=e=>h.error(fbErr(e));
      col("items").onSnapshot(h.items,err);col("parties").onSnapshot(h.parties,err);col("days").onSnapshot(h.days,err);
      ref("meta/settings").onSnapshot(h.settings,err);
    },
    put(path,data){return soft(ref(path).set(data));},
    del(path){return soft(ref(path).delete());},
    /* Replace one bill, payment, stock entry or purchase inside its day; creates the day if it is new (works offline too) */
    dayEntry(date,k,id,obj){return soft(ref("days/"+date).set({date,[k]:{[id]:obj==null?FV.delete():obj}},{mergeFields:["date",new FP(k,id)]}));},
    /* Bill numbers: a transaction on the counter, so two devices never take the same number.
       Without internet a transaction cannot run; the next number after the bills on this device is used instead. */
    async alloc(series,minNext){
      if(navigator.onLine===false)return minNext;
      const r=ref("meta/ctr_"+series);
      const tx=fs.runTransaction(async t=>{const sn=await t.get(r);const last=sn.exists?num((sn.data()||{}).last):0;const next=Math.max(last+1,minNext);t.set(r,{last:next,series,at:new Date().toISOString()});return next;});
      try{return await Promise.race([tx,offline(7000)]);}
      catch(e){const c=e&&e.code;if(c==="offline"||c==="unavailable"||c==="failed-precondition")return minNext;throw fbErr(e);}
    },
    async release(series,seq){
      if(navigator.onLine===false)return false;
      const r=ref("meta/ctr_"+series);
      const tx=fs.runTransaction(async t=>{const sn=await t.get(r);const last=sn.exists?num((sn.data()||{}).last):0;if(last===seq)t.set(r,{last:seq-1,series,at:new Date().toISOString()});});
      try{await Promise.race([tx,offline(7000)]);return true;}catch(e){return false;}
    }
  };
}

    if(/invalid-email/.test(c))return "This email does not look right.";
    if(/too-many-requests/.test(c))return "Too many tries. Wait a few minutes, or reset the password.";
    if(/network-request-failed/.test(c))return "No internet. Connect and try again.";
    if(/user-disabled/.test(c))return "This login is turned off.";
    return "Could not log in"+(e&&e.message?": "+e.message:".");};
  const ready=async()=>{try{await startFirebase();return true;}catch(err){say(err&&err.code==="config"?err.message:"Could not reach the login service. Check the internet and try again.");return false;}};
  f.onsubmit=async e=>{e.preventDefault();const em=$("#lgEmail").value.trim(),pw=$("#lgPass").value;
    if(!em||!pw){say("Enter the email and password.");return;}
    b.disabled=true;say("");if(!(await ready())){b.disabled=false;return;}

    if(!(await ready()))return;

const sdkDone=new Set();let sdkP=null,fbP=null,fbStarted=false;
function loadFirebaseSDK(){
  if(window.firebase&&window.firebase.initializeApp&&window.firebase.auth&&window.firebase.firestore)return Promise.resolve();
  if(sdkP)return sdkP;
  const L=Array.isArray(window.FIREBASE_SDK)?window.FIREBASE_SDK:[];
  if(!L.length)return Promise.reject(new Error("The Firebase SDK is missing from this page."));
  sdkP=Promise.all(L.filter(u=>!sdkDone.has(u)).map(u=>new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=u;sc.async=false;
    sc.onload=()=>{sdkDone.add(u);res();};sc.onerror=()=>{sc.remove();rej(new Error("Could not load "+u));};document.head.appendChild(sc);})))
    .catch(e=>{sdkP=null;throw e;});
  return sdkP;
}
function startFirebase(){
  if(fbP)return fbP;
  fbP=(async()=>{
    await loadFirebaseSDK();
    try{if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FB);}catch(e){throw Object.assign(new Error("The Firebase settings in this page are not valid."),{code:"config"});}
    const fs=firebase.firestore();S.fs=fs;
    try{const pr=fs.enablePersistence({synchronizeTabs:true});if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
    const auth=firebase.auth();S.fbAuth=auth;
    auth.onAuthStateChanged(fbAuthChanged);
  })();
  fbP.catch(e=>{console.error("firebase",e);if(e&&e.code!=="config")fbP=null;});
  return fbP;
}
function fbAuthChanged(user){
  if(user){
    if(FB_ROLES){const pick=rolePick();
      if(pick==="developer"&&!isDevEmail(user.email)){S.loginMsg="This email is not a developer login. Choose Owner, or use the developer email.";S.wantLogin=true;S.fbAuth.signOut();return;}
      S.role=pick;}
    else S.role=null;
    lsSet("mb-staff","1");
    S.fbUser=user;hideLogin();hideSite();
    if(!fbStarted){fbStarted=true;S.store=makeFirebaseStore(S.fs);S.mode="cloud";renderChrome();render();startCloud();}else{renderChrome();render();}
  }else{
    S.fbUser=null;
    if(fbStarted){if(!S.signingOut)location.reload();return;}
    if(!$("#site-root"))showSite();
    if(S.wantLogin)showLogin();
  }
}
/* Website copy: visitors get the shop page at once; a device that logged in before waits for its login instead.
   A link to a billing screen (like #new) or #login opens the staff login over the shop page. */
function webStart(){
  const h=(location.hash||"").replace(/^#/,"");
  if(/(^|&)site(=|&|$)/.test(location.search.slice(1))){showSite({preview:true});return;}
  if(lsGet("mb-staff")==="1"){S.wantLogin=true;startFirebase().catch(()=>{showSite();showLogin("Could not reach the login service. Check the internet and reload the page.");});return;}
  showSite();
  if(h==="login"||VIEWS[h]){if(h==="login")try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    S.wantLogin=true;showLogin();startFirebase().catch(()=>{});}
}
async function fbLogout(){if(!S.fbAuth)return;if(!(await confirmBox("Log out from this device? The shop data saved on this device for offline use is removed too.",{ok:"Log out"})))return;await fbSignOut();}
async function fbSignOut(){
  S.signingOut=true;clearDraft();lsSet("mb-staff",null);
  try{if(S.fs){await S.fs.terminate();await S.fs.clearPersistence();}}catch(e){}
  try{await S.fbAuth.signOut();}catch(e){}
  location.reload();
}

function keepFocus(fn){
  const a=document.activeElement;const id=a&&a.id;let s=null,e=null;
  try{s=a.selectionStart;e=a.selectionEnd;}catch(_){}
  const y=window.scrollY;fn();
  if(id){const n=document.getElementById(id);if(n&&n!==document.activeElement){n.focus({preventScroll:true});try{if(s!=null)n.setSelectionRange(s,e);}catch(_){}}}
  window.scrollTo(0,y);
}

function openModal(o){
  const root=$("#modal-root");const wrap=document.createElement("div");wrap.className="modal-wrap";
  wrap.innerHTML='<div class="modal '+(o.cls||"")+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><div class="modal-head"><h2>'+esc(o.title)+'</h2><button type="button" class="icon-btn" data-close aria-label="Close">'+icon("x")+'</button></div><div class="modal-body">'+o.body+"</div>"+(o.foot?'<div class="modal-foot">'+o.foot+"</div>":"")+"</div>";
  root.appendChild(wrap);document.body.classList.add("modal-open");
  let closed=false;
  const close=()=>{if(closed)return;closed=true;wrap.remove();if(!root.children.length)document.body.classList.remove("modal-open");if(o.onClose)o.onClose();};
  wrap.addEventListener("mousedown",e=>{wrap._down=e.target;});
  wrap.addEventListener("click",e=>{if((e.target===wrap&&wrap._down===wrap)||e.target.closest("[data-close]"))close();});
  wrap._close=close;
  const m=wrap.querySelector(".modal");
  if(o.onMount)o.onMount(m,close);
  setTimeout(()=>{const f=m.querySelector("[data-autofocus]");if(f&&!COARSE)f.focus();},40);
  return close;
}

/* Files: inside the artifact viewer files go through the downloads capability; a saved copy of the page uses a normal download. */
async function saveFile(filename,data,mime){
  if(ENV==="artifact"){
    let dl=S.dl;if(!dl){try{dl=await window.claude.use("downloads");}catch(e){dl=null;}S.dl=dl;}
    if(!dl){toast("Saving files is not available in this view.","bad");return false;}
    try{await dl.save({filename,data});return true;}
    catch(e){const c=e&&e.code;if(c==="declined")return false;if(c==="rate_limited"){toast("A save prompt is already open.");return false;}toast("The file could not be saved ("+(c||"error")+").","bad");return false;}
  }
  try{const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;}
  catch(e){toast("The file could not be saved.","bad");return false;}
}

const DLV_SAC="9965";
function dlvLine(d,gstOn){const a=num(d.dlv&&d.dlv.amt);if(!(a>0)||(gstOn&&d.dlv.gst===false))return null;
  return {key:"dlv",kind:"delivery",item:null,name:"Delivery charges",hsn:DLV_SAC,unit:"NOS",qty:1,rate:a,disc:0,gst:gstOn?num(d.dlv.rate):0};}
const dlvExtra=(d,gstOn)=>gstOn&&d.dlv&&d.dlv.gst===false&&num(d.dlv.amt)>0?r2(num(d.dlv.amt)):0;
const shipOf=x=>{const o=x&&x.ship||{};const r={};for(const k of ["name","vehicle","lr","eway","address"]){const v=String(o[k]||"").trim();if(v)r[k]=v;}return Object.keys(r).length?r:null;};

function newDraft(type){const st=S.settings;return {id:null,type:type||"INV",ship:blankShip(),dlv:blankDlv(),noMode:st.noMode==="manual"?"manual":"auto",manualNo:"",no:null,seq:null,fy:null,series:null,date:todayISO(),origDate:null,time:null,party:{id:null,name:"",phone:"",address:"",gstin:"",state:""},pos:st.state||"",incl:!!st.incl&&!(st.mrpBill&&st.incl),mrp:!!(st.mrpBill&&st.incl),lines:[],pay:{mode:"cash",paid:null},note:"",ref:null,status:"active",created:null};}
function loadDraft(){

    const out=Object.assign(newDraft(d.type==="QT"?"QT":"INV"),d);out.party=Object.assign(newDraft().party,d.party||{});out.ship=Object.assign(blankShip(),d.ship||{});out.dlv=Object.assign(blankDlv(),d.dlv||{});out.pay=Object.assign({mode:"cash",paid:null},d.pay||{});out.lines=d.lines.filter(l=>l&&l.key);return out;}
  catch(e){return null;}
}

function draftCalc(){
  const st=S.settings;const gstOn=st.gstType==="regular";const inter=gstOn&&!!D.pos&&!!st.state&&D.pos!==st.state;
  const dl=dlvLine(D,gstOn);
  const lines=D.lines.filter(l=>String(l.name||"").trim()||num(l.rate)>0).concat(dl?[dl]:[]);
  return Object.assign(calcBill(lines,{incl:D.incl,mrp:D.mrp,gstOn,inter,roundOff:st.roundOff,extra:dlvExtra(D,gstOn)}),{inter,gstOn});
}
function receivedOf(total){if(D.type==="QT")return 0;if(D.pay.paid==null||D.pay.paid==="")return total;return Math.max(0,num(D.pay.paid));}
function maxSeq(series){let m=0;for(const b of S.bills)if(b.series===series&&b.seq>m)m=b.seq;for(const p of S.purchases){if(p.series===series&&p.seq>m)m=p.seq;if(p.pay&&p.pay.pvSeries===series&&p.pay.pvSeq>m)m=p.pay.pvSeq;}return m;}
function nextSeqFor(series,st){return Math.max(maxSeq(series)+1,Math.floor(num((st.startSeq||{})[series]))||1);}
/* A typed bill number that follows PREFIX/YY-YY/NNNN joins that series, so the automatic numbers continue after it.
   Any other format is kept in a separate manual series. */
function parseBillNo(no,type,st,fy){
  const pre=cleanPrefix(type==="QT"?st.qtPrefix:st.invPrefix,type==="QT"?"QT":"INV");
  const m=/^([A-Z0-9-]+)\/(\d{2}-\d{2})\/(\d{1,6})$/.exec(no);
  if(m&&m[1]===pre)return {series:pre+"_"+m[2],seq:parseInt(m[3],10)};
  const t=/(\d{1,9})$/.exec(no);
  return {series:"MANUAL_"+type+"_"+fy,seq:t?parseInt(t[1],10):0};
}

function ddKeys(e,dd,onEnterEmpty){
  const its=$$(".dd-it",dd);const open=dd.classList.contains("open")&&its.length>0;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!open)return;e.preventDefault();let i=its.findIndex(x=>x.classList.contains("act"));i=e.key==="ArrowDown"?Math.min(its.length-1,i+1):Math.max(0,i-1);its.forEach((x,j)=>x.classList.toggle("act",j===i));its[i].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){if(open){e.preventDefault();const a=its.find(x=>x.classList.contains("act"))||its[0];a.dataset.kb="1";a.click();}else if(onEnterEmpty){e.preventDefault();onEnterEmpty();}}
  else if(e.key==="Escape"&&open){e.stopPropagation();dd.classList.remove("open");}
}
function itemSearch(q){
  const ql=q.toLowerCase().trim();const t=ql.split(/\s+/).filter(Boolean);if(!t.length)return [];
  const res=[];
  for(const it of S.itemsArr){
    const hay=(it.name+" "+(it.brand||"")+" "+(it.code||"")+" "+(it.cat||"")+" "+(it.hsn||"")).toLowerCase();
    if(!t.every(x=>hay.includes(x)))continue;
    const nm=String(it.name).toLowerCase();let sc=0;
    if((it.code||"").toLowerCase()===ql)sc-=10;
    if(t.every(x=>nm.includes(x)))sc-=4;
    if(nm.startsWith(t[0]))sc-=2;else if((" "+nm).includes(" "+t[0]))sc-=1;
    res.push([sc,it]);
  }
  res.sort((a,b)=>a[0]-b[0]||String(a[1].name).localeCompare(String(b[1].name)));
  return res.slice(0,12).map(x=>x[1]);
}

function gstinHint(){

function recalc(){
  if(!D||S.view!=="new"||!$("#slipTotals"))return;
  const st=S.settings;const c=draftCalc();const s=c.sum;
  const byKey=new Map(c.lines.map(l=>[l.key,l]));
  for(const l of D.lines){
    const x=byKey.get(l.key);const a=document.getElementById("amt-"+l.key),tx=document.getElementById("tax-"+l.key);
    if(a)a.innerHTML=x?fmt(x.amount)+(x.discAmt>0?`<small>−${fmt(x.discAmt)} off</small>`:""):"—";
    if(tx)tx.textContent=x?fmt(x.taxable):"—";
    const ef=document.getElementById("eff-"+l.key);
    if(ef){ef.textContent=x&&x.eff!=null&&num(x.rate)>0?"bill "+fq(x.eff)+"%":"";ef.title=ef.textContent?"Printed on the bill as Disc "+fq(x.eff)+"%":"";}
  }
  const utl=UT_CODES.has(st.state)?"UTGST":"SGST";const mrpB=s.mrpOff!=null;
  const rows=[[mrpB?"MRP value":"Gross amount",money(s.gross)]];
  if(s.discount>0)rows.push([mrpB?"Less: bill discount":"Less: discount","−"+money(s.discount)]);
  const dl=c.lines.find(x=>x.kind==="delivery");
  if(dl)rows.push([c.gstOn?"Includes delivery (GST "+fq(dl.gst)+"%)":"Includes delivery",money(dl.amount)]);
  if(c.gstOn){rows.push(["Taxable value",money(s.taxable)]);if(c.inter)rows.push(["IGST",money(s.igst)]);else{rows.push(["CGST",money(s.cgst)]);rows.push([utl,money(s.sgst)]);}}
  if(s.other)rows.push(["Delivery charges (without GST)",money(s.other)]);
  rows.push(["Round off",s.roundoff?(s.roundoff>0?"+":"−")+fmt(Math.abs(s.roundoff)):"0.00"]);
  $("#slipTotals").innerHTML=`<table class="tot-tbl"><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table>
    <div class="grand-row"><span class="g-lbl">Grand total<span class="g-sub">${c.gstOn?(c.inter?"Inter-state · IGST":"Same state · CGST + "+utl):"No GST charged"}</span></span><span class="g-val">${money(s.total)}</span></div>
    ${mrpB&&s.mrpOff>0?`<p class="mrp-save">Customer saves ${money(s.mrpOff)} on MRP</p>`:""}
    <p class="words">${s.total>0?esc(inWords(s.total)):""}</p>`;
  const nG=c.lines.filter(isGoods).length;
  $("#igCount").textContent=nG+" item"+(nG===1?"":"s")+" · Qty "+fq(s.qty);
  dlvHint(c);
  let abs="Total <b>"+money(s.total)+"</b>";
  if(D.type!=="QT"){
    const rec=receivedOf(s.total);const bal=r2(s.total-rec);
    if(bal>0.009)abs+=' · Udhaar <b class="bad-t">'+money(bal)+"</b>";
    const bp=$("#bPaid");if(bp)bp.placeholder=s.total>0?fmt(s.total):"Full amount";
    $("#payInfo").innerHTML=s.total<=0?"":bal>0.009?`<div class="pay-bal bad-t">Udhaar ${money(bal)}${D.party.name.trim()?" for "+esc(D.party.name.trim()):""}</div>`:bal<-0.009?`<div class="pay-bal good-t">Return change ${money(-bal)}</div>`:`<div class="pay-bal good-t">Fully paid</div>`;
    $("#payQR").innerHTML=D.pay.mode==="upi"&&st.upi?qrBlock(st,Math.min(rec,s.total)):"";
  }
  $("#abSum").innerHTML=abs;
  $("#slipWarn").innerHTML=draftWarnings(c).map(w=>`<div class="warn-line ${w[0]}">${icon("alert")}<span>${w[1]}</span></div>`).join("");
  $("#savebarTotal").textContent=money(s.total);
  $("#savebarSub").textContent=nG+" item"+(nG===1?"":"s")+(D.type==="QT"?" · quotation":"");
}

async function saveBill(next){

  if(!keep.some(isGoods)){toast("Add at least one item with a quantity.","bad");const s=$("#iSearch");if(s)s.focus();return;}

    }

    else if(!D.id){fy=fyOf(D.date);series=seriesOf(D.type,fy,st);let min=nextSeqFor(series,st);
      for(let i=0;i<5;i++){seq=await S.store.alloc(series,min);no=billNoOf(series,seq);if(!S.bills.some(x=>x.type===D.type&&String(x.no).toUpperCase()===no))break;min=seq+1;}}
    const now=Date.now();

      party:{id:pid||null,name:pName,phone:D.party.phone.trim(),address:D.party.address.trim(),gstin:gi.g,state:D.party.state||gi.state||""},
      pos:D.pos||st.state||"",inter:c.inter,incl:!!D.incl,mrp:!!(D.mrp&&!D.incl),gstMode:st.gstType,
      lines:calc.lines.map(l=>Object.assign({item:l.item||null,name:String(l.name).trim(),hsn:String(l.hsn||"").trim(),unit:l.unit||"PCS",qty:l.qty,rate:l.rate,disc:l.disc,gst:l.gst,taxable:l.taxable,cgst:l.cgst,sgst:l.sgst,igst:l.igst,amount:l.amount},l.eff!=null?{eff:l.eff}:{},l.kind==="delivery"?{kind:"delivery"}:{})),
      ship:shipOf(D),dlv:num(D.dlv&&D.dlv.amt)>0?{amt:r2(num(D.dlv.amt)),gst:c.gstOn?D.dlv.gst!==false:false,rate:num(D.dlv.rate)||18}:null,
      sum:calc.sum,pay:{mode:D.type==="QT"?"":(D.pay.mode||"cash"),paid},

    a.push(`<button type="button" class="btn" data-a="copy">${icon("copy")}Copy as new</button>`);
    if(isQ&&!b.ref)a.push(`<button type="button" class="btn btn-primary" data-a="convert">Make ${esc(docTitle("INV",st.gstType).toLowerCase())}</button>`);

/* Delete a bill or quotation for good. If it carried the latest number of its series, that number is used again for the next bill. */

      +(wasLast?"<br><br>The next new bill will get this number again.":auto?"<br><br>This number will stay unused in the series.":"");
  if(!(await confirmBox(msg,{ok:isQ?"Delete quotation":"Delete bill",danger:true,title:isQ?"Delete quotation":"Delete bill"})))return false;

function paidInfo(b){
  if(!b||b.type!=="INV"||b.status==="cancelled")return null;
  const tot=num(b.sum&&b.sum.total);if(!(tot>0))return null;
  const atBill=num(b.pay&&b.pay.paid);
  /* A bill saved a moment ago may not be in the ledger yet: then only what was received at billing counts */
  const due=S.billDue&&S.billDue.has(b.id)?num(S.billDue.get(b.id)):r2(tot-atBill);
  if(due>0.009)return null;
  if(atBill>=tot-0.009)return {date:b.date,mode:PAY_LABEL[b.pay&&b.pay.mode]||""};
  const pid=b.party&&b.party.id;const p=pid&&S.parties?S.parties.get(pid):null;
  if(!p)return {date:"",mode:""};
  let need=Math.max(0,num(p.open)),extra=Math.max(0,-num(p.open));
  const list=S.bills.filter(x=>x.type==="INV"&&x.status!=="cancelled"&&x.party&&x.party.id===pid).map(x=>({x,due:r2(num(x.sum&&x.sum.total)-num(x.pay&&x.pay.paid))}));
  list.sort((a,c)=>(a.x.date+pad(a.x.seq||0,6)).localeCompare(c.x.date+pad(c.x.seq||0,6)));
  for(const d of list)if(d.due<0)extra+=-d.due;
  for(const d of list){if(d.due<=0)continue;need+=d.due;if(d.x.id===b.id)break;}
  need=r2(need-extra);
  if(need<=0.009)return {date:b.date,mode:""};
  const pays=(S.payments||[]).filter(q=>q.party===pid).slice().sort((a,c)=>String(a.date||"").localeCompare(String(c.date||""))||(num(a.created)-num(c.created)));
  let cum=0;for(const q of pays){cum+=num(q.amount);if(cum>=need-0.009)return {date:q.date||"",mode:PAY_LABEL[q.mode]||""};}
  return {date:"",mode:""};
}
